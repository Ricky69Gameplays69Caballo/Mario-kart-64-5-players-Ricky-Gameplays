name: Downloadable releases

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.1.0)
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release with upstream credits
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
              --title "Mario Kart 64 5+ Players — Ricky Gameplays $RELEASE_TAG" \
              --notes-file docs/RELEASE-NOTES.md
          fi

  build:
    needs: prepare
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            os: windows
    defaults:
      run:
        shell: bash
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/cache/restore@v4
        id: dependency-cache
        with:
          path: .vcpkg-cache
          key: release-deps-${{ matrix.platform }}-${{ hashFiles('vcpkg.json', 'cmake/TorchExternalFixes.cmake') }}
      - name: Prepare dependency cache
        run: mkdir -p .vcpkg-cache
      - name: Configure Windows
        run: cmake -S . -B build -G "Visual Studio 17 2022" -T v143 -A x64 -DCMAKE_BUILD_TYPE=Release -DENABLE_VCPKG=ON
      - name: Save compiled dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}
      - name: Generate port resources (no ROM extraction)
        run: cmake --build build --config Release --target GenerateO2R --parallel 3
      - name: Build game
        run: cmake --build build --config Release --parallel 3
      - name: Prepare release documentation and controller database
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/master/gamecontrollerdb.txt \
            --output build/gamecontrollerdb.txt
          cp docs/RELEASE-NOTES.md build/README-Release.md
      - name: Package Windows
        run: python .github/scripts/package_release.py --platform "${{ matrix.platform }}" --build-dir build --output-dir dist
      - name: Keep build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
      - name: Attach downloads to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
