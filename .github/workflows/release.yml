name: Downloadable releases

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.1.0)
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release with upstream credits
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
              --title "Mario Kart 64 5+ Players — Ricky Gameplays $RELEASE_TAG" \
              --notes-file docs/RELEASE-NOTES.md
          fi

  build:
    needs: prepare
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            os: windows
          - platform: macos-arm64
            runner: macos-15
            os: macos
          - platform: macos-x64
            runner: macos-15-intel
            os: macos
          - platform: linux-x64
            runner: ubuntu-22.04
            os: linux
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            os: linux
    defaults:
      run:
        shell: bash
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: release-deps-${{ matrix.platform }}-${{ hashFiles('vcpkg.json', 'cmake/TorchExternalFixes.cmake') }}
      - name: Prepare dependency cache
        run: mkdir -p .vcpkg-cache
      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build cmake curl zip unzip tar pkg-config \
            autoconf automake libtool libx11-dev libxrandr-dev libxi-dev libxinerama-dev \
            libxcursor-dev libgl1-mesa-dev libopengl-dev libwayland-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev
      - name: Install macOS build dependencies
        if: matrix.os == 'macos'
        run: brew install ninja cmake
      - name: Configure Windows
        if: matrix.os == 'windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -T v143 -A x64 -DCMAKE_BUILD_TYPE=Release -DENABLE_VCPKG=ON
      - name: Configure macOS and Linux
        if: matrix.os != 'windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DENABLE_VCPKG=ON
      - name: Generate port resources (no ROM extraction)
        run: cmake --build build --config Release --target GenerateO2R --parallel 3
      - name: Build game
        run: cmake --build build --config Release --parallel 3
      - name: Prepare release documentation and controller database
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/master/gamecontrollerdb.txt \
            --output build/gamecontrollerdb.txt
          cp docs/RELEASE-NOTES.md build/README-Release.md
      - name: Package Windows and macOS
        if: matrix.os != 'linux'
        run: python .github/scripts/package_release.py --platform "${{ matrix.platform }}" --build-dir build --output-dir dist
      - name: Package Linux AppImage
        if: matrix.os == 'linux'
        run: |
          (cd build && cpack -G External)
          python .github/scripts/package_release.py --platform "${{ matrix.platform }}" --build-dir build --output-dir dist
      - name: Keep build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
      - name: Attach downloads to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
